<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill Visualizer</title>
<style>
:root{color-scheme:light;--ink:#17243a;--muted:#52627a;--line:#d9e2ee;--bg:#eef3f9;--card:#fff;--tint:#f5f8fc;--accent:#2457a7;--note:#096b69;--note-bg:#eef9f7;--warn:#8a5713;--warn-bg:#fff7eb;--stop:#a12d39;--stop-bg:#fff1f2;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#e6edf6;--muted:#9fb0c6;--line:#2b3b52;--bg:#0f1826;--card:#16233a;--tint:#1a2a45;--accent:#7fb0ff;--note:#5fd0c9;--note-bg:#12302f;--warn:#f0b866;--warn-bg:#35280f;--stop:#ff8d99;--stop-bg:#3a1a20}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,"Segoe UI",sans-serif}
.shell{max-width:1120px;margin:auto;background:var(--card);min-height:100vh;box-shadow:0 0 35px #1e3d6120}
.hero{padding:40px 40px 28px;background:linear-gradient(125deg,#112c51,#245c81);color:#fff}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:#b7dbe9;font-weight:700}
.hero h1{font-size:clamp(1.9rem,4vw,2.9rem);line-height:1.25;margin:.3rem 0 .6rem;overflow-wrap:anywhere}
.hero p{max-width:800px;margin:0;color:#e3edf5;font-size:1.05rem}
.origin{font:.8rem var(--mono);color:#b7dbe9;margin-top:18px;overflow-wrap:anywhere}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow:auto;padding:10px 32px;background:var(--card);border-bottom:1px solid var(--line)}
.tab{white-space:nowrap;border:0;border-radius:20px;padding:6px 14px;background:none;color:var(--muted);font:inherit;font-size:.9rem;font-weight:650;cursor:pointer}
.tab:hover{background:var(--tint)}.tab[aria-selected=true]{background:var(--accent);color:var(--card)}
.tab:focus-visible,.step:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:12px 40px 56px}.panel[hidden]{display:none}
h2{font-size:1.5rem;margin:28px 0 12px;line-height:1.35}h3{font-size:1.05rem;margin:0 0 8px;line-height:1.4}p{margin:6px 0 12px}
.lead{font-size:1.1rem}.muted{color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:8px 0 6px;padding:0;list-style:none}
.step{display:block;width:100%;height:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--tint);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:10px;padding:14px 15px}
.step:hover{border-color:var(--accent)}
.step .num{display:block;font-size:.75rem;font-weight:800;color:var(--accent);letter-spacing:.08em}
.step strong{display:block;font-size:.98rem;line-height:1.4;margin-top:2px}
.step small{display:block;color:var(--muted);line-height:1.5;margin-top:6px;font-size:.84rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--card)}
.card.tint{background:var(--tint)}.card h3{color:var(--accent)}
.card ul,.plain{margin:4px 0 0;padding-left:1.3em}.card li,.plain li{margin:5px 0}.card p:last-child{margin-bottom:0}
.callout{border-left:4px solid var(--note);background:var(--note-bg);padding:10px 16px;margin:14px 0;border-radius:0 8px 8px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-bg)}.callout.stop{border-color:var(--stop);background:var(--stop-bg)}
.callout b{margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0}
.chip{font:.8rem var(--mono);border:1px solid var(--line);background:var(--tint);color:var(--accent);border-radius:20px;padding:3px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.kicker{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 4px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-top:22px}summary{cursor:pointer;font-weight:650}
.outline{list-style:none;margin:10px 0 0;padding:0}.outline li{padding:9px 0;border-top:1px solid var(--line)}.outline b{display:block;font-size:.95rem}.outline span{color:var(--muted);font-size:.9rem}
.tree{list-style:none;margin:0;font:.85rem/1.9 var(--mono)}.tree .dir{color:var(--muted)}.tree button{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:0}.tree button:hover{text-decoration:underline}
.rel{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.rel .to{font:.85rem var(--mono);overflow-wrap:anywhere}.rel .why{flex-basis:100%;color:var(--muted);font-size:.88rem}
.tag{font-size:.74rem;font-weight:800;padding:1px 9px;border-radius:20px;background:var(--card);color:var(--accent);border:1px solid var(--line)}
.tag.inferred{color:var(--warn);background:var(--warn-bg);border-style:dashed}
.src{display:grid;grid-template-columns:240px 1fr;gap:14px;margin-top:10px}
.filelist{display:flex;flex-direction:column;gap:5px;max-height:70vh;overflow:auto}
.filelist button{text-align:left;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px 10px;font:.78rem var(--mono);cursor:pointer}
.filelist button[aria-current=true]{border-color:var(--accent);background:var(--tint)}
.box{background:#101a27;color:#e2eaf4;border-radius:10px;padding:14px 0;max-height:70vh;overflow:auto;min-width:0}
.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:0 16px 10px;color:#9fb8d6;font:.78rem var(--mono)}
.bar button{background:#243650;color:#d6e4f5;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}.bar button[aria-pressed=true]{background:#4a74b0}
.code{margin:0;font:.78rem/1.6 var(--mono)}.code div{padding:0 16px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.6em}
.code .add{background:#12351f;color:#a6e8bb}.code .del{background:#3d1a20;color:#ffb3bd}.code .hunk{color:#8db8ff}.code .meta{color:#7e92ad}
footer{color:var(--muted);font-size:.8rem;padding:24px;text-align:center}
@media(max-width:760px){.hero,main{padding-left:18px;padding-right:18px}.tabs{padding:10px 14px}.src{grid-template-columns:1fr}.filelist{max-height:190px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell">
<header class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="description"></p><div class="origin" id="origin"></div></header>
<nav class="tabs" id="tabs" role="tablist"></nav><main id="panels"></main>
<footer id="footer"></footer></div>
<script>
const D=__DATA__;
const T={en:{overview:'Overview',structure:'Structure',code:'Code',guide:'Skill guide',flow:'Workflow',flowHint:'Click a step to see details.',applies:'When it applies',outline:'SKILL.md outline',files:'Files',rels:'How files relate',relNone:'No file relationships were identified.',explicit:'explicit',inferred:'inferred',inferredHint:'Inferred from structure, not an explicit link',source:'Source',diff:'Diff vs origin/main',noDiff:'No diff available.',related:'Related files',footer:'Generated locally · source is shown as text, nothing is executed'},
ja:{overview:'全体像',structure:'Skill構成',code:'ソース',guide:'Skill ガイド',flow:'全体の流れ',flowHint:'ステップを押すと詳細を表示します。',applies:'使う場面',outline:'SKILL.md の構成',files:'ファイル',rels:'ファイル同士の関係',relNone:'ファイル間の関係は見つかりませんでした。',explicit:'明示',inferred:'推定',inferredHint:'明示的なリンクではなく、構成から推定',source:'ソース',diff:'origin/main との差分',noDiff:'差分はありません。',related:'関連ファイル',footer:'ローカル生成 · ソースはテキストとして表示。実行はしません'}};
const L=T[D.lang]||T.en;document.documentElement.lang=T[D.lang]?D.lang:'en';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
$('eyebrow').textContent=L.guide;$('title').textContent=D.name;$('description').textContent=D.description||'';$('origin').textContent=D.sourceRoot;$('footer').textContent=L.footer;
document.title=D.name+' · '+L.guide;

const steps=D.tabs.filter(t=>t.kind==='detail');
const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
const chip=f=>`<button type="button" class="chip" data-file="${esc(f)}">${esc(f)}</button>`;
const callout=n=>`<div class="callout ${['warn','stop'].includes(n.kind)?n.kind:''}">${n.label?`<b>${esc(n.label)}</b>`:''}${esc(n.text)}</div>`;
const card=c=>`<div class="card ${c.items?'':'tint'}"><h3>${esc(c.title)}</h3>${c.body?`<p>${esc(c.body)}</p>`:''}${c.items?`<ul>${li(c.items)}</ul>`:''}</div>`;

function overview(){
  const applies=D.appliesWhen.length?`<h2>${L.applies}</h2><div class="card tint"><ul class="plain">${li(D.appliesWhen)}</ul></div>`:'';
  const flow=steps.length>1?`<h2>${L.flow}</h2><p class="muted">${L.flowHint}</p><ol class="flow">${steps.map((t,i)=>`<li><button type="button" class="step" data-tab="${t.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><strong>${esc(t.title)}</strong><small>${esc(t.brief||t.summary)}</small></button></li>`).join('')}</ol>`:'';
  const outline=D.sections.length?`<details><summary>${L.outline}</summary><ul class="outline">${D.sections.map(s=>`<li><b>${esc(s.title)}</b><span>${esc(s.summary)}</span></li>`).join('')}</ul></details>`:'';
  return applies+flow+D.notes.map(callout).join('')+outline;
}
function detail(t){
  return `<h2>${esc(t.title)}</h2><p class="lead">${esc(t.summary)}</p>`+(t.cards.length?`<div class="grid">${t.cards.map(card).join('')}</div>`:'')+t.notes.map(callout).join('')+(t.files.length?`<div class="kicker">${L.related}</div><div class="chips">${t.files.map(chip).join('')}</div>`:'');
}
function structure(){
  let prev=[];
  const tree=D.files.map(f=>{const p=f.path.split('/'),name=p.pop();let out='';p.forEach((d,i)=>{if(prev[i]!==d)out+=`<li class="dir" style="padding-left:${i*18}px">${esc(d)}/</li>`});prev=p;return out+`<li style="padding-left:${p.length*18}px"><button type="button" data-file="${esc(f.path)}">${esc(name)}</button></li>`}).join('');
  const by={};D.edges.forEach(e=>(by[e.from]=by[e.from]||[]).push(e));
  const rels=D.edges.length?Object.entries(by).map(([from,es])=>`<div class="card tint" style="margin-bottom:12px"><div class="chips">${chip(from)}</div>${es.map(e=>`<div class="rel"><span>→</span><span class="to">${esc(e.to)}</span><span class="tag ${e.evidence==='inferred'?'inferred':''}" title="${e.evidence==='inferred'?esc(L.inferredHint):''}">${esc(e.kind)} · ${e.evidence==='inferred'?L.inferred:L.explicit}</span><span class="why">${esc(e.reason)}</span></div>`).join('')}</div>`).join(''):`<p class="muted">${L.relNone}</p>`;
  return `<div class="grid"><div><h2>${L.files}</h2><ul class="tree card">${tree}</ul></div><div><h2>${L.rels}</h2>${rels}</div></div>`;
}
let sel=0,showDiff=false;
function code(){return `<h2>${L.source}</h2><div class="src"><div class="filelist" id="filelist"></div><div class="box"><div class="bar"><span id="fname"></span><span><button type="button" id="b-src">${L.source}</button> <button type="button" id="b-diff">${L.diff}</button></span></div><pre class="code" id="src"></pre></div></div>`}
function renderCode(){
  [...$('filelist').children].forEach((b,i)=>b.setAttribute('aria-current',i===sel));
  const f=D.files[sel];$('fname').textContent=showDiff?L.diff:(f?f.path:'');
  $('b-src').setAttribute('aria-pressed',!showDiff);$('b-diff').setAttribute('aria-pressed',showDiff);
  const text=showDiff?(D.diff||D.diffNote||L.noDiff):(f?f.content:'');
  $('src').innerHTML=text.split('\n').map(l=>{let c='';if(showDiff)c=/^(\+\+\+|---|diff |index |new file)/.test(l)?'meta':l[0]==='+'?'add':l[0]==='-'?'del':l[0]==='@'?'hunk':'';return `<div class="${c}">${esc(l)}</div>`}).join('');
}
function activate(id,jump){
  document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.id===id;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;if(on)b.scrollIntoView({inline:'center',block:'nearest'})});
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='panel-'+id);
  if(jump)window.scrollTo({top:$('tabs').offsetTop,behavior:'smooth'});
}
function openFile(path){const i=D.files.findIndex(f=>f.path===path);if(i<0)return;sel=i;showDiff=false;activate('code',true);renderCode()}

const render={overview,structure,code};
for(const t of D.tabs){
  const b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.id='tab-'+t.id;b.dataset.id=t.id;b.textContent=t.kind==='detail'?t.label:L[t.kind];b.setAttribute('aria-controls','panel-'+t.id);$('tabs').appendChild(b);
  const p=document.createElement('section');p.className='panel';p.id='panel-'+t.id;p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby','tab-'+t.id);
  p.innerHTML=(render[t.kind]||detail)(t);$('panels').appendChild(p);
}
D.files.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.textContent=f.path;b.onclick=()=>{sel=i;showDiff=false;renderCode()};$('filelist').appendChild(b)});
$('b-src').onclick=()=>{showDiff=false;renderCode()};$('b-diff').onclick=()=>{showDiff=true;renderCode()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-file],.tab');if(!el)return;if(el.dataset.file)openFile(el.dataset.file);else if(el.dataset.tab)activate(el.dataset.tab,true);else activate(el.dataset.id)});
$('tabs').addEventListener('keydown',e=>{const k={ArrowRight:1,ArrowLeft:-1}[e.key];if(!k)return;const bs=[...document.querySelectorAll('.tab')],i=bs.indexOf(document.activeElement);if(i<0)return;const n=bs[(i+k+bs.length)%bs.length];n.focus();activate(n.dataset.id)});
activate(D.tabs[0].id);renderCode();
</script></body></html>
